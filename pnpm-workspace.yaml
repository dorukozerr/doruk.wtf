catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0

peerDependencyRules:
  allowAny:
    - vite
    - oxc-transform-react
  allowedVersions:
    vite: '*'

allowBuilds:
  esbuild: true
  react-p5: true
  workerd: true
  p5: true

overrides:
  vite@*: 'catalog:'

permissions:
  '@tanstack/react-router':
    skills: false
  '@tanstack/react-start':
    skills: false
  '@tanstack/router-plugin':
    skills: false
